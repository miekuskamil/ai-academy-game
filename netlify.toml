[build]
  # Just the Vite build. src/generated/curriculum.json is committed, and CI
  # fails if it is stale, so the deploy image needs no Python at all.
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# HashRouter means the server only ever serves index.html, but the redirect
# keeps deep links working if routing is ever switched to history mode.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed assets are immutable; the entry document never is.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # No third-party origins: fonts, scripts and styles all ship in the bundle.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
