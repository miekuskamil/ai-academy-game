  id: w3-01-close
  title: The right box
  beats:
    - id: b1
      speaker: mila
      text: So drafting my speech is your job, but deciding what I really feel is mine.
      prop: none
      mood: curious
    - id: b2
      speaker: iskra
      text: Perfectly sorted. I will draft. You will mean it. Best team.
      prop: none
      mood: excited
    - id: b3
      speaker: mila
      text: Knowing when NOT to use you might be the useful bit.
      prop: none
      mood: proud
    - id: b4
      speaker: iskra
      text: It really is. A good tool user knows what the tool is not for.
      prop: none
      mood: calm
      highlight: not for
