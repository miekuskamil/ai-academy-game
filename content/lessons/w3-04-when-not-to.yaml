      prop: none
      mood: confused
    - id: b3
      speaker: mila
      text: Oh. You are right. That is not mine to type into a public app.
      prop: none
      mood: curious
    - id: b4
      speaker: iskra
      text: Some things just should not go in here. Knowing which is a real skill.
      prop: none
