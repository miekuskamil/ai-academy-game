id: w3-when-not-to
world: using-ai-for-real
title: When not to use it
goal: Recognise situations where using AI is unsafe, unfair, unkind, or against the point.
intro: >-
  Part of being good with AI is knowing when to close it. Some things should not
  go into an AI, and some jobs you are meant to do yourself. This is not about
  being scared of AI — it is about being the kind of person who uses it wisely and
  kindly.
minutes: 12
tracks: [explorer, builder]
prereqs: [w3-thinking-partner]

open_comic:
  id: w3-04-open
  title: Do not paste that
  beats:
    - id: b1
      speaker: mila
      text: I will just paste my friend's home address in and ask you to map it.
      prop: none
      mood: calm
    - id: b2
