    - id: b3
      speaker: mila
      text: That explains so much about you.
      prop: none
      mood: proud
    - id: b4
      speaker: iskra
      text: It explains my best moments and my silliest ones. Now you know the trick.
      prop: none
      mood: excited
      highlight: trick
