name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  content:
    name: content pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - name: Validate and compile curriculum
        run: python tools/build_content.py
      - run: python -m pytest tools -q
      - name: Fail if the compiled bundle is stale
        run: git diff --exit-code src/generated

  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      - run: npm run build
      - run: npm run size
